sample:
  name: Æther AT Command Modem
  description: AT command interface for Æther mesh network access
  
common:
  tags:
    - net
    - lora
    - mesh
    - modem
    - usb
    
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Aether modem ready"
      
  platform_allow:
    - rpi_pico
    - esp32s3_devkitc/esp32s3/procpu
    - nrf52840dk_nrf52840
    
  integration_platforms:
    - rpi_pico
    
  filter: dt_chosen_enabled("zephyr,lora") and CONFIG_USB_DEVICE_STACK
  
tests:
  sample.net.aether.modem:
    tags:
      - net
      - lora
      - usb