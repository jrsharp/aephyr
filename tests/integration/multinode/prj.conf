# Aether multinode test configuration
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_CUSTOM=y

# Aether UART transport
CONFIG_SERIAL=y
CONFIG_AETHER_UART=y
CONFIG_AETHER_UART_LOG_LEVEL=4

# Aether mesh
CONFIG_AETHER_MESH=y
CONFIG_AETHER_MESH_LOG_LEVEL=4
CONFIG_AETHER_MAX_NEIGHBORS=8
CONFIG_AETHER_MAX_ROUTES=16
CONFIG_AETHER_HELLO_INTERVAL=10

# Shell for interactive testing
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Random for address generation
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Heap for mesh context allocation
CONFIG_HEAP_MEM_POOL_SIZE=4096
