# Basic Zephyr configuration
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Networking core
CONFIG_NETWORKING=y
CONFIG_NET_L2_CUSTOM=y

# Enable HeyMac Layer 2
CONFIG_NET_L2_HEYMAC=y

# Enable Æther mesh networking
CONFIG_AETHER_MESH=y

# Enable LoRa driver integration
CONFIG_AETHER_LORA=y
CONFIG_AETHER_LORA_TX_POWER=5
CONFIG_AETHER_LORA_BW=0
CONFIG_AETHER_LORA_SF=10
CONFIG_AETHER_LORA_CR=1

# LoRa driver with SX126X support (but disable LoRaWAN)
CONFIG_LORA=y
CONFIG_LORA_SX126X=y
CONFIG_LORA_INIT_PRIORITY=80
CONFIG_SPI=y

# Explicitly disable LoRaWAN subsystem 
CONFIG_LORAWAN=n

# ESP32-S3 specific thread stack sizes
CONFIG_AETHER_RX_STACK_SIZE=4096
CONFIG_AETHER_TX_STACK_SIZE=4096

# Shell support for debugging
CONFIG_SHELL=y
CONFIG_AETHER_SHELL=y
CONFIG_DEVICE_SHELL=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_NET_LOG=y
CONFIG_NET_L2_HEYMAC_LOG_LEVEL=4
CONFIG_AETHER_MESH_LOG_LEVEL=4
CONFIG_AETHER_LORA_LOG_LEVEL=4
CONFIG_LORA_LOG_LEVEL_DBG=y

# Network interface debugging
CONFIG_NET_IF_LOG_LEVEL_DBG=y

# GPIO for reset/control pins
CONFIG_GPIO=y

# Optional: Enable more debug features
# CONFIG_DEBUG=y
# CONFIG_ASSERT=y
# CONFIG_THREAD_MONITOR=y
# CONFIG_THREAD_NAME=y
# CONFIG_THREAD_STACK_INFO=y