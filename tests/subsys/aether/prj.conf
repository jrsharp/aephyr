# SPDX-License-Identifier: Apache-2.0

CONFIG_ZTEST=y
CONFIG_ZTEST_NEW_API=y

# Networking for packet handling
CONFIG_NETWORKING=y
CONFIG_NET_L2_CUSTOM=y

# Heap for mesh context allocation
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# For random address generation
CONFIG_TEST_RANDOM_GENERATOR=y

# Mesh config stubs
CONFIG_AETHER_MAX_NEIGHBORS=4
CONFIG_AETHER_MAX_ROUTES=4
CONFIG_AETHER_HELLO_INTERVAL=30
CONFIG_AETHER_ROUTE_TIMEOUT=300
CONFIG_AETHER_NEIGHBOR_TIMEOUT=90
CONFIG_AETHER_DEFAULT_TTL=6
CONFIG_AETHER_CONDITIONAL_NET_ID=y
CONFIG_AETHER_MAX_PAYLOAD=64
