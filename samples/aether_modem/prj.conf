# SPDX-License-Identifier: MIT

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_CUSTOM=y

# LoRa and Æther stack
CONFIG_LORA=y
CONFIG_LORA_SX126X=y
CONFIG_NET_L2_HEYMAC=y
CONFIG_AETHER_MESH=y
CONFIG_AETHER_LORA=y

# USB CDC ACM for serial interface
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Aether Modem"
CONFIG_USB_DEVICE_VID=0x2E8A
CONFIG_USB_DEVICE_PID=0x000A
CONFIG_USB_CDC_ACM=y

# UART for AT commands
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Console and shell disabled (using UART for AT commands)
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n

# AT command interface
CONFIG_RING_BUFFER=y

# Message storage
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Thread stack sizes (smaller for RP2040)
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_AETHER_RX_STACK_SIZE=1536
CONFIG_AETHER_TX_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# Logging (optional, can be disabled for production)
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y

# Power optimization
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Minimal footprint optimizations
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_COMPILER_OPT="-Os"
CONFIG_PRINTK=n