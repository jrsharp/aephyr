# DECT NR+ PHY build of the Æther basic sample (nRF9151 DK / Thingy:91 X).
# Build: west build -b nrf9151dk/nrf9151/ns -- -DCONF_FILE=prj_dect.conf
#
# The DECT NR+ PHY operates on regulated channels. Only enable a carrier if you are
# permitted to operate on the DECT band and can meet local access rules.

# Basic Zephyr configuration
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_FPU=y
CONFIG_ASSERT=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Networking core + custom L2. The Æther mesh is a custom L2 (HeyMac), not
# IP-routed, but the net stack still requires a packet protocol to be selected
# (net_pkt.c errors otherwise). So leave IPv6 enabled but turn off its
# housekeeping (Neighbor Discovery / Router Solicitation / DAD / MLD) so it
# stays silent and doesn't waste DECT airtime.
CONFIG_NETWORKING=y
CONFIG_NET_L2_CUSTOM=y
CONFIG_NET_IPV6_ND=n
CONFIG_NET_IPV6_DAD=n
CONFIG_NET_IPV6_MLD=n

# net_pkt / net_buf pools
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# HeyMac L2 + Æther mesh
CONFIG_NET_L2_HEYMAC=y
CONFIG_AETHER_MESH=y

# DECT NR+ PHY driver integration.
# Carrier 1677 is a common EU value; set it per your region (1711 is common US).
CONFIG_AETHER_DECT=y
CONFIG_AETHER_DECT_CARRIER=1677
CONFIG_AETHER_DECT_TX_POWER=11
CONFIG_AETHER_DECT_MCS=1
# Absorb start-up TX bursts so net bring-up doesn't overflow the queue.
CONFIG_AETHER_DECT_TX_QUEUE_SIZE=8

# DECT NR+ PHY modem
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
CONFIG_MODEM_ANTENNA=n
CONFIG_HWINFO=y

# Non-secure target: build as a non-secure image with TF-M (minimal profile)
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# Shell for debugging. The sample registers the 'aether' command group (chat,
# status, send) in main.c, and the DECT driver registers the 'dect' group, so
# the module's own AETHER_SHELL is left off to avoid a duplicate 'aether' root.
CONFIG_SHELL=y
CONFIG_AETHER_SHELL=n
CONFIG_DEVICE_SHELL=y

# Logging. INF keeps the milestones (PHY ready, mesh ready, chat, election);
# DBG was very noisy (the DECT RX window logs once per ~200 ms cycle).
CONFIG_LOG=y
CONFIG_NET_L2_HEYMAC_LOG_LEVEL=3
CONFIG_AETHER_MESH_LOG_LEVEL=3
CONFIG_AETHER_DECT_LOG_LEVEL=3
